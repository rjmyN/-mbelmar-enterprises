<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Mbelmar Enterprises</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="stylesheet" href="styles.css">
    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-color: var(--black);
        }
        .success-content {
            text-align: center;
            max-width: 600px;
        }
        .success-content img {
            max-width: 200px;
            margin-bottom: 2rem;
        }
        .success-content h1 {
            color: var(--gold);
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 1rem;
        }
        .success-content p {
            color: var(--text-light);
            font-size: 1.125rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }
        .home-button {
            display: inline-block;
            background-color: var(--gold);
            color: var(--white);
            padding: 1rem 3rem;
            text-decoration: none;
            border-radius: 2px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: background-color 0.3s ease;
        }
        .home-button:hover {
            background-color: var(--dark-gold);
        }
    </style>
</head>
<body>
    <div class="success-page">
        <div class="success-content">
            <img src="logo.jpg" alt="Mbelmar Enterprises">
            <h1>Thank You</h1>
            <p>Your inquiry has been received and will be reviewed by our team. We will respond to you shortly.</p>
            <a href="index.html" class="home-button">Return to Home</a>
        </div>
    </div>
</body>
</html>
